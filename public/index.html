<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebSocket Sensor Demo</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 16px;
      background: #f0f0f0;
    }
    html.mobile-no-scroll,
    html.mobile-no-scroll body {
      overflow: hidden;
      overscroll-behavior: none;
    }
    html.mobile-no-scroll body {
      touch-action: none;
    }
    h1 { font-size: 1.2rem; margin-bottom: 8px; }
    h2 {
      font-size: 1rem;
      margin: 18px 0 8px;
    }
    #status {
      padding: 8px 12px;
      border-radius: 4px;
      font-weight: bold;
      margin-bottom: 16px;
      background: #e0e0e0;
    }
    #status.connected { background: #c8f0c8; color: #1a6b1a; }
    #status.disconnected { background: #f0c8c8; color: #6b1a1a; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
    }
    th, td {
      text-align: left;
      padding: 8px 12px;
      border-bottom: 1px solid #e8e8e8;
      font-size: 0.9rem;
    }
    th { background: #4a90e2; color: #fff; }
    tr:last-child td { border-bottom: none; }
    .rate-badge {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #e8f2ff;
      color: #1f5f99;
      font-size: 0.76rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .rate-badge.hidden { display: none; }
    #log {
      margin-top: 16px;
      background: #1e1e1e;
      color: #d4d4d4;
      font-size: 0.78rem;
      font-family: monospace;
      padding: 10px;
      height: 180px;
      overflow-y: auto;
      border-radius: 4px;
    }
    #gps-btn {
      margin-bottom: 12px;
      padding: 8px 14px;
      background: #4a90e2;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    #gps-btn:disabled { background: #9e9e9e; cursor: default; }
    #command-target {
      margin: 12px 0 0;
      padding: 12px;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      background: #ffffff;
      color: #222;
      font-weight: 700;
      transition: background-color 0.18s ease, color 0.18s ease;
    }
    .command-controls {
      display: flex;
      gap: 8px;
      margin: 10px 0 14px;
      max-width: 420px;
    }
    .command-controls input {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid #c8c8c8;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    .command-controls button {
      padding: 8px 12px;
      background: #4a90e2;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <h1>WebSocket Sensor Demo</h1>
  <div id="status" class="disconnected">Disconnected</div>
  <div id="client-id">Client ID: —</div>
  <div id="device-type">Device: —</div>
  <div id="client-role">Role: —</div>
  <div id="command-target">Command Target: —</div>
  <div class="command-controls">
    <input id="set-color-input" type="text" value="#34c759" placeholder="#34c759 or red" />
    <button id="set-color-btn" type="button">Send SetColor</button>
  </div>

  <button id="gps-btn">Enable GPS</button>

  <h2>送信しているデータ</h2>
  <table>
    <thead>
      <tr><th>Type</th><th>Data</th></tr>
    </thead>
    <tbody id="data-rows">
      <tr id="row-outgoing-gps"><td>GPS</td><td id="outgoing-gps">—</td></tr>
      <tr id="row-outgoing-mouse"><td>Mouse</td><td id="outgoing-mouse">—</td></tr>
      <tr id="row-outgoing-gyro"><td>deviceOrientation <span id="gyro-send-rate" class="rate-badge hidden"></span></td><td id="outgoing-gyro">—</td></tr>
      <tr id="row-outgoing-motion"><td>deviceMotion</td><td id="outgoing-motion">—</td></tr>
      <tr id="row-outgoing-touch"><td>Touch</td><td id="outgoing-touch">—</td></tr>
    </tbody>
  </table>

  <h2>受信しているデータ</h2>
  <table>
    <thead>
      <tr><th>Type</th><th>Data</th></tr>
    </thead>
    <tbody id="relay-rows">
      <tr id="row-incoming-gps"><td>GPS</td><td id="incoming-gps">—</td></tr>
      <tr id="row-incoming-mouse"><td>Mouse</td><td id="incoming-mouse">—</td></tr>
      <tr id="row-incoming-gyro"><td>deviceOrientation</td><td id="incoming-gyro">—</td></tr>
      <tr id="row-incoming-motion"><td>deviceMotion</td><td id="incoming-motion">—</td></tr>
      <tr id="row-incoming-touch"><td>Touch</td><td id="incoming-touch">—</td></tr>
    </tbody>
  </table>

  <div id="log"></div>

  <script>
    // ── Helpers ──────────────────────────────────────────────────────────────
    const statusEl = document.getElementById('status');
    const clientIdEl = document.getElementById('client-id');
    const deviceTypeEl = document.getElementById('device-type');
    const clientRoleEl = document.getElementById('client-role');
    const commandTargetEl = document.getElementById('command-target');
    const setColorInput = document.getElementById('set-color-input');
    const setColorBtn = document.getElementById('set-color-btn');
    const gyroSendRateEl = document.getElementById('gyro-send-rate');
    const logEl    = document.getElementById('log');
    const gpsBtn   = document.getElementById('gps-btn');
    let clientId = null;
    let deviceType = null;
    let clientRole = null;
    const isMobileBrowser = /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(navigator.userAgent);

    if (isMobileBrowser) {
      document.documentElement.classList.add('mobile-no-scroll');
    }

    function appendLog(text) {
      const line = document.createElement('div');
      line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + text;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setText(id, text) {
      document.getElementById(id).textContent = text;
    }

    function formatAxisValue(value) {
      return typeof value === 'number' ? value.toFixed(2) : 'n/a';
    }

    function formatVector(vector) {
      if (!vector) { return 'x:n/a y:n/a z:n/a'; }
      return `x:${formatAxisValue(vector.x)} y:${formatAxisValue(vector.y)} z:${formatAxisValue(vector.z)}`;
    }

    function formatRotationRate(rotationRate) {
      if (!rotationRate) { return 'alpha:n/a beta:n/a gamma:n/a'; }
      return `alpha:${formatAxisValue(rotationRate.alpha)} beta:${formatAxisValue(rotationRate.beta)} gamma:${formatAxisValue(rotationRate.gamma)}`;
    }

    function formatMotionData(payload) {
      if (!payload) { return 'No payload'; }
      return `acc[${formatVector(payload.acceleration)}] gravity[${formatVector(payload.accelerationIncludingGravity)}] rot[${formatRotationRate(payload.rotationRate)}] interval:${formatAxisValue(payload.interval)}ms`;
    }

    function displayTypeName(type) {
      if (type === 'gyroscope') { return 'deviceOrientation'; }
      if (type === 'motion') { return 'deviceMotion'; }
      return type;
    }

    function formatRelayData(type, payload) {
      if (!payload) { return 'No payload'; }
      if (type === 'SetColor') {
        return `color:${payload.color || payload.Color || 'n/a'}`;
      }
      if (type === 'command') {
        return JSON.stringify(payload);
      }
      if (type === 'gps') {
        return `${payload.latitude.toFixed(6)}, ${payload.longitude.toFixed(6)} (+/-${payload.accuracy.toFixed(0)} m)`;
      }
      if (type === 'gyroscope') {
        return `alpha:${(payload.alpha || 0).toFixed(1)} beta:${(payload.beta || 0).toFixed(1)} gamma:${(payload.gamma || 0).toFixed(1)}`;
      }
      if (type === 'motion') {
        return formatMotionData(payload);
      }
      if (type === 'touch_start' || type === 'touch_move' || type === 'touch_end') {
        const touches = payload.touches || [];
        return touches.map((t) => `(${t.x.toFixed(0)},${t.y.toFixed(0)})`).join(' ');
      }
      if (type === 'mouse_move' || type === 'mouse_click') {
        return `x:${payload.x} y:${payload.y}`;
      }
      return JSON.stringify(payload);
    }

    function normalizeCommand(relay) {
      const payload = relay.payload || {};
      if (relay.originalType === 'SetColor') {
        return {
          command: 'SetColor',
          params: payload,
        };
      }
      if (relay.originalType === 'command') {
        return {
          command: payload.command || payload.Command || payload.name || payload.Name,
          params: payload,
        };
      }
      return null;
    }

    function isValidCssColor(value) {
      if (typeof value !== 'string' || value.trim() === '') {
        return false;
      }
      const testEl = document.createElement('span');
      testEl.style.color = '';
      testEl.style.color = value;
      return testEl.style.color !== '';
    }

    function getReadableTextColor(backgroundColor) {
      const testEl = document.createElement('span');
      testEl.style.color = backgroundColor;
      document.body.appendChild(testEl);
      const rgb = getComputedStyle(testEl).color.match(/\d+/g);
      document.body.removeChild(testEl);
      if (!rgb || rgb.length < 3) {
        return '#222';
      }
      const [r, g, b] = rgb.map(Number);
      const brightness = (r * 299 + g * 587 + b * 114) / 1000;
      return brightness < 140 ? '#fff' : '#222';
    }

    function executeRelayCommand(relay) {
      if (relay.fromRole !== 'special') {
        return false;
      }
      const normalized = normalizeCommand(relay);
      if (!normalized || normalized.command !== 'SetColor') {
        return false;
      }
      const color = normalized.params.color || normalized.params.Color;
      if (!isValidCssColor(color)) {
        appendLog('Ignored SetColor with invalid color from ' + relay.fromClientId);
        return true;
      }

      commandTargetEl.style.backgroundColor = color;
      commandTargetEl.style.color = getReadableTextColor(color);
      commandTargetEl.textContent = 'Command Target: SetColor ' + color + ' from ' + relay.fromClientId;
      appendLog('Command SetColor from ' + relay.fromClientId + ': ' + color);
      return true;
    }

    function updateRelayDisplay(relay) {
      const prefix = relay.fromClientId + ': ';
      const text = prefix + formatRelayData(relay.originalType, relay.payload);
      if (relay.originalType === 'gps') {
        setText('incoming-gps', text);
      } else if (relay.originalType === 'gyroscope') {
        setText('incoming-gyro', text);
      } else if (relay.originalType === 'motion') {
        setText('incoming-motion', text);
      } else if (relay.originalType === 'touch_start' ||
                 relay.originalType === 'touch_move' ||
                 relay.originalType === 'touch_end') {
        setText('incoming-touch', text);
      } else if (relay.originalType === 'mouse_move' ||
                 relay.originalType === 'mouse_click') {
        setText('incoming-mouse', text);
      }
    }

    // ── WebSocket ─────────────────────────────────────────────────────────────
    const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + location.search;
    let ws = null;
    let reconnectTimer = null;

    function connect() {
      ws = new WebSocket(WS_URL);

      ws.addEventListener('open', () => {
        statusEl.textContent = 'Connected';
        statusEl.className = 'connected';
        appendLog('WebSocket connected');
        if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
      });

      ws.addEventListener('message', (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'connected' && msg.payload && msg.payload.clientId) {
            clientId = msg.payload.clientId;
            deviceType = msg.payload.deviceType || 'unknown';
            clientRole = msg.payload.role || 'viewer';
            clientIdEl.textContent = 'Client ID: ' + clientId;
            deviceTypeEl.textContent = 'Device: ' + deviceType;
            clientRoleEl.textContent = 'Role: ' + clientRole;
          } else if (msg.type === 'relay' && msg.payload) {
            updateRelayDisplay(msg.payload);
            executeRelayCommand(msg.payload);
            appendLog('Relay from ' + msg.payload.fromClientId + ' (' + displayTypeName(msg.payload.originalType) + ')');
            return;
          } else if (msg.type === 'client_disconnected' && msg.payload) {
            appendLog('Client disconnected: ' + msg.payload.clientId + ' (' + msg.payload.deviceType + ', role=' + msg.payload.role + ')');
            return;
          }
          appendLog('Server: ' + JSON.stringify(msg));
        } catch {
          appendLog('Server (raw): ' + event.data);
        }
      });

      ws.addEventListener('close', () => {
        statusEl.textContent = 'Disconnected';
        statusEl.className = 'disconnected';
        clientId = null;
        deviceType = null;
        clientRole = null;
        clientIdEl.textContent = 'Client ID: —';
        deviceTypeEl.textContent = 'Device: —';
        clientRoleEl.textContent = 'Role: —';
        appendLog('WebSocket disconnected – reconnecting in 3 s');
        reconnectTimer = setTimeout(connect, 3000);
      });

      ws.addEventListener('error', () => {
        appendLog('WebSocket error');
      });
    }

    function send(type, payload) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type, payload }));
      }
    }

    function sendSetColorCommand() {
      const color = setColorInput.value.trim();
      if (!isValidCssColor(color)) {
        appendLog('SetColor not sent: invalid color "' + color + '"');
        setColorInput.focus();
        return;
      }
      send('SetColor', { color });
      appendLog('Sent SetColor: ' + color);
    }

    setColorBtn.addEventListener('click', sendSetColorCommand);
    setColorInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        sendSetColorCommand();
      }
    });

    connect();

    // ── GPS ───────────────────────────────────────────────────────────────────
    let gpsWatchId = null;

    gpsBtn.addEventListener('click', () => {
      if (!('geolocation' in navigator)) {
        appendLog('Geolocation not supported');
        return;
      }
      if (gpsWatchId !== null) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
        gpsBtn.textContent = 'Enable GPS';
        setText('outgoing-gps', '—');
        appendLog('GPS stopped');
        return;
      }
      gpsBtn.disabled = true;
      gpsBtn.textContent = 'Requesting GPS…';
      gpsWatchId = navigator.geolocation.watchPosition(
        (pos) => {
          gpsBtn.disabled = false;
          gpsBtn.textContent = 'Stop GPS';
          const payload = {
            latitude:  pos.coords.latitude,
            longitude: pos.coords.longitude,
            accuracy:  pos.coords.accuracy,
            altitude:  pos.coords.altitude,
            timestamp: pos.timestamp,
          };
          setText('outgoing-gps',
            `${payload.latitude.toFixed(6)}, ${payload.longitude.toFixed(6)} (±${payload.accuracy.toFixed(0)} m)`);
          send('gps', payload);
        },
        (err) => {
          gpsBtn.disabled = false;
          gpsBtn.textContent = 'Enable GPS';
          appendLog('GPS error: ' + err.message);
          gpsWatchId = null;
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    });

    // ── Mouse ─────────────────────────────────────────────────────────────────
    let mousePayload = null;

    document.addEventListener('mousemove', (e) => {
      mousePayload = { x: e.clientX, y: e.clientY, screenX: e.screenX, screenY: e.screenY };
      setText('outgoing-mouse', `x:${e.clientX} y:${e.clientY}`);
    });

    document.addEventListener('click', (e) => {
      if (e.target.closest && e.target.closest('.command-controls')) {
        return;
      }
      const payload = { x: e.clientX, y: e.clientY, button: e.button, type: 'click' };
      send('mouse_click', payload);
    });

    // throttle mousemove sends to avoid flooding
    setInterval(() => {
      if (mousePayload) {
        send('mouse_move', mousePayload);
        mousePayload = null;
      }
    }, 100);

    // ── Gyroscope (DeviceOrientation) ─────────────────────────────────────────
    const GYRO_SEND_INTERVAL_MS = 20;
    let gyroPayload = null;
    let gyroSentCount = 0;

    function updateGyroSendRate(rate) {
      if (rate > 0) {
        gyroSendRateEl.textContent = rate + 'Hz';
        gyroSendRateEl.classList.remove('hidden');
      } else {
        gyroSendRateEl.textContent = '';
        gyroSendRateEl.classList.add('hidden');
      }
    }

    function startGyro() {
      window.addEventListener('deviceorientation', (e) => {
        gyroPayload = { alpha: e.alpha, beta: e.beta, gamma: e.gamma };
        setText('outgoing-gyro',
          `α:${(e.alpha||0).toFixed(1)} β:${(e.beta||0).toFixed(1)} γ:${(e.gamma||0).toFixed(1)}`);
      });
    }

    // iOS 13+ requires permission
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      document.addEventListener('click', function handleGyroPermissionRequest() {
        DeviceOrientationEvent.requestPermission()
          .then((state) => {
            if (state === 'granted') { startGyro(); }
            document.removeEventListener('click', handleGyroPermissionRequest);
          })
          .catch(() => {});
      }, { once: true });
    } else if (typeof DeviceOrientationEvent !== 'undefined') {
      startGyro();
    }

    setInterval(() => {
      if (gyroPayload) {
        send('gyroscope', gyroPayload);
        gyroSentCount += 1;
        gyroPayload = null;
      }
    }, GYRO_SEND_INTERVAL_MS);

    setInterval(() => {
      updateGyroSendRate(gyroSentCount);
      gyroSentCount = 0;
    }, 1000);

    // ── Motion (DeviceMotion) ─────────────────────────────────────────────────
    const MOTION_SEND_INTERVAL_MS = 20;
    let motionPayload = null;

    function copyAcceleration(acceleration) {
      if (!acceleration) { return null; }
      return {
        x: acceleration.x,
        y: acceleration.y,
        z: acceleration.z,
      };
    }

    function copyRotationRate(rotationRate) {
      if (!rotationRate) { return null; }
      return {
        alpha: rotationRate.alpha,
        beta: rotationRate.beta,
        gamma: rotationRate.gamma,
      };
    }

    function startMotion() {
      window.addEventListener('devicemotion', (e) => {
        motionPayload = {
          acceleration: copyAcceleration(e.acceleration),
          accelerationIncludingGravity: copyAcceleration(e.accelerationIncludingGravity),
          rotationRate: copyRotationRate(e.rotationRate),
          interval: e.interval,
          timestamp: Date.now(),
        };
        setText('outgoing-motion', formatMotionData(motionPayload));
      });
    }

    // iOS 13+ requires permission
    if (typeof DeviceMotionEvent !== 'undefined' &&
        typeof DeviceMotionEvent.requestPermission === 'function') {
      document.addEventListener('click', function handleMotionPermissionRequest() {
        DeviceMotionEvent.requestPermission()
          .then((state) => {
            if (state === 'granted') { startMotion(); }
            document.removeEventListener('click', handleMotionPermissionRequest);
          })
          .catch(() => {});
      }, { once: true });
    } else if (typeof DeviceMotionEvent !== 'undefined') {
      startMotion();
    }

    setInterval(() => {
      if (motionPayload) {
        send('motion', motionPayload);
        motionPayload = null;
      }
    }, MOTION_SEND_INTERVAL_MS);

    // ── Touch ─────────────────────────────────────────────────────────────────
    document.addEventListener('touchstart', (e) => {
      const touches = Array.from(e.touches).map((t) => ({ x: t.clientX, y: t.clientY, id: t.identifier }));
      setText('outgoing-touch', touches.map((t) => `(${t.x.toFixed(0)},${t.y.toFixed(0)})`).join(' '));
      send('touch_start', { touches });
    });

    document.addEventListener('touchmove', (e) => {
      if (isMobileBrowser && e.cancelable) {
        e.preventDefault();
      }
      const touches = Array.from(e.touches).map((t) => ({ x: t.clientX, y: t.clientY, id: t.identifier }));
      setText('outgoing-touch', touches.map((t) => `(${t.x.toFixed(0)},${t.y.toFixed(0)})`).join(' '));
      send('touch_move', { touches });
    }, { passive: false });

    document.addEventListener('touchend', (e) => {
      const touches = Array.from(e.changedTouches).map((t) => ({ x: t.clientX, y: t.clientY, id: t.identifier }));
      send('touch_end', { touches });
    });
  </script>
</body>
</html>
